name: terraform

# Checks only. Unlike the Azure and GCP stacks, apply/destroy run from the laptop (`make up` / `make down`):
# this AWS account lives in an AWS-managed organization whose SCP denies creating the IAM OIDC provider
# GitHub Actions would need, and storing long-lived AWS keys in GitHub was ruled out.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - name: Validate
        run: |
          for dir in bootstrap infra; do
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --init && tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
      - name: Shellcheck
        run: shellcheck scripts/*.sh
